[project]
name = "flowmap"
version = "0.2.0"
description = "Hartă vizuală a execuției și a fluxului de date pentru proiecte Python și PHP, cu feliere dinamică (VS Code friendly)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Paul Gabriel Mihăicuța" }]
requires-python = ">=3.12"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Debuggers",
  "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
flowmap = "flowmap.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flowmap*"]

[tool.setuptools.package-data]
flowmap = ["viewer/*.html", "templates/*.json", "php/*.php"]

[tool.pytest.ini_options]
testpaths = ["tests"]
