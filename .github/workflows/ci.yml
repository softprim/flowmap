name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - name: PHP (dacă lipsește, testele PHP se sar)
        shell: bash
        run: php -v || echo "php indisponibil pe acest runner"
      - name: Browser pentru testul de integrare al vizualizatorului (doar Ubuntu)
        if: runner.os == 'Linux'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - run: python -m pytest -q
