name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - name: PHP 8 (pentru testele suportului PHP; runner-ele macOS nu îl au preinstalat)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - run: php -v
      - name: Browser pentru testul de integrare al vizualizatorului (doar Ubuntu)
        if: runner.os == 'Linux'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - run: python -m pytest -q
